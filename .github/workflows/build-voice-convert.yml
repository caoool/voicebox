name: Build Voice-Convert Artifacts

# Produce downloadable build artifacts that exercise the new
# voice-to-voice feature.  Triggers:
#   • Manual dispatch (any branch)
#   • Push of a tag matching v*-vc (e.g. v0.4.0-vc)
#   • Any push/PR touching the voice-convert back/frontend code
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to build (default: current branch)'
        required: false
        default: ''
  push:
    tags:
      - 'v*-vc'
    paths:
      - 'backend/backends/local_vc_backend.py'
      - 'backend/backends/__init__.py'
      - 'backend/services/voice_convert.py'
      - 'backend/routes/voice_convert.py'
      - 'app/src/components/VoiceConvertTab/**'

jobs:
  # ------------------------------------------------------------------
  # 1. Python back-end unit tests (Ubuntu, no GPU)
  # ------------------------------------------------------------------
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install soundfile numpy sqlalchemy fastapi httpx python-multipart

      - name: Run voice-convert tests
        run: pytest backend/tests/test_voice_convert.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}

  # ------------------------------------------------------------------
  # 2. Front-end type-check + build (web mode)
  # ------------------------------------------------------------------
  frontend-build:
    name: Frontend typecheck + web build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build web (smoke test)
        run: bun run build:web

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicebox-web-build-${{ github.sha }}
          path: app/dist/
          retention-days: 7

  # ------------------------------------------------------------------
  # 3. Python server standalone binary (Ubuntu / Linux x86_64)
  # ------------------------------------------------------------------
  backend-binary-linux:
    name: Python backend binary (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r backend/requirements.txt

      - name: Build server binary
        working-directory: backend
        run: python build_binary.py

      - name: Upload server binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicebox-server-linux-x86_64-${{ github.sha }}
          path: backend/dist/voicebox-server
          retention-days: 7

  # ------------------------------------------------------------------
  # 4. Attach artifacts to a GitHub Release when a v*-vc tag is pushed
  # ------------------------------------------------------------------
  release-attach:
    name: Attach artifacts to release
    needs: [backend-tests, frontend-build, backend-binary-linux]
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-vc')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Download all artifacts produced by this run
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List artifacts
        run: ls -lR release-artifacts/

      # Zip the web build
      - name: Zip web build
        run: |
          cd release-artifacts
          zip -r voicebox-web-build.zip voicebox-web-build-*/

      # Make the Linux binary executable and zip it
      - name: Zip Linux binary
        run: |
          cd release-artifacts
          chmod +x voicebox-server-linux-x86_64-*/voicebox-server 2>/dev/null || true
          zip -r voicebox-server-linux.zip voicebox-server-linux-x86_64-*/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/voicebox-web-build.zip
            release-artifacts/voicebox-server-linux.zip
          draft: false
          prerelease: true
          generate_release_notes: true
